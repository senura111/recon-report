name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project with dev dependencies
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      # The coverage threshold (fail_under) lives in pyproject.toml.
      - name: Test with coverage
        run: pytest --cov=recon_report --cov-report=term-missing

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Build wheel and sdist
        run: |
          python -m pip install build
          python -m build

      - name: Verify templates are included in the wheel
        shell: python
        run: |
          import sys
          import zipfile
          from pathlib import Path

          expected = {
              "recon_report/templates/report.css",
              "recon_report/templates/report.html.j2",
              "recon_report/templates/report.js",
              "recon_report/templates/report.md.j2",
          }
          wheels = list(Path("dist").glob("*.whl"))
          if len(wheels) != 1:
              sys.exit(f"Expected exactly one wheel in dist/, found {len(wheels)}")
          with zipfile.ZipFile(wheels[0]) as wheel:
              missing = expected - set(wheel.namelist())
          if missing:
              sys.exit(f"{wheels[0].name} is missing templates: {sorted(missing)}")
          print(f"{wheels[0].name} includes all {len(expected)} templates")
          if not list(Path("dist").glob("*.tar.gz")):
              sys.exit("No sdist found in dist/")
