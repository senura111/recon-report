[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "recon-report"
version = "0.1.0"
description = "Defensive reconnaissance and reporting CLI for authorized penetration testing."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Senura Nimthaka" }]
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "jinja2>=3.1",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Environment :: Console",
    "Topic :: Security",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
recon-report = "recon_report.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/recon_report"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
